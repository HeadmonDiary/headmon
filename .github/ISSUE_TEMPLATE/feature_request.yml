name: Feature request
description: Suggest a Headmon improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the need without sharing real diary or health information. Headmon prioritizes local-only storage and optional, privacy-preserving features.
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Both Android and iOS
        - iOS
        - Android
        - Not platform-specific
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no real diary, health, photo or location data.
          required: true
