name: Bug report
description: Report a reproducible Headmon problem without sharing private diary data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Headmon.

        **Do not attach Headmon JSON, CSV or PDF exports, medical documents, private photos, exact locations or other health information.** GitHub Issues are public. Use invented example data. If the report cannot be made without personal information, do not submit it.
  - type: input
    id: version
    attributes:
      label: Headmon version and build
      description: Find this under Settings → About Headmon.
      placeholder: "1.0 (31)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating-system version
      placeholder: "iPhone model, iOS version / Android model, Android version"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use invented diary details and list the exact sequence.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed real health data, exports, private photos and exact locations from this report.
          required: true
